name: approval
# The run name shows which commit a reviewer approves.
run-name: approval for ${{ github.event.pull_request.head.sha }}
on:
  pull_request_target:
    branches: [main]
    # edited covers a base branch that changes to main after other checks ran.
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions: {}
jobs:
  approval:
    # No `if:` here: GitHub counts a skipped job as a passed required check.
    runs-on: ubuntu-latest
    environment: approval
    steps:
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "approval: approved $HEAD_SHA"
