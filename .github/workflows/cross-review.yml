name: cross-review
on:
  # The workflow and the factory binary come from main, so that a pull
  # request cannot reach the key. The pull request is read only as git data.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Without the key: turns the check green after a code owner's approval.
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: write
  actions: read
jobs:
  cross-review:
    # No `if:` here: GitHub counts a skipped job as a passed required check.
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out main
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false
      - name: Fetch the pull request as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request_target'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: base/go.mod
      - name: Review
        if: github.event_name == 'pull_request_target'
        env:
          FACTORY_MODEL_KEY: ${{ secrets.OPPER_API_KEY }}
        run: |
          go build -C base -o "$RUNNER_TEMP/bin/factory" ./cmd/factory
          factory="$RUNNER_TEMP/bin/factory"
          cd pr
          design=no
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(docs/increments/[^/]+/design\.md|docs/domain/)'; then
            design=yes
          fi
          if [ "$design" = no ]; then
            block=$(printf '{"cwd":"%s","stop_hook_active":false}' "$PWD" | "$factory" hook stop || true)
            if [ -n "$block" ]; then
              echo "cross-review: waiting for a review result for the latest code commit"
              echo "$block"
              exit 1
            fi
          fi
          set +e
          "$factory" cross-review --base "$BASE" > "$RUNNER_TEMP/review.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/review.txt"
          { echo "Review by another model for $HEAD_SHA:"; echo; echo '```'; cat "$RUNNER_TEMP/review.txt"; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          if [ "$design" = yes ]; then
            echo "cross-review: design pull request, the findings are notes for the engineer"
            exit 0
          fi
          exit $code
      - name: Follow a code owner's approval
        if: github.event_name == 'pull_request_review'
        env:
          STATE: ${{ github.event.review.state }}
          ASSOCIATION: ${{ github.event.review.author_association }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          if [ "$STATE" = approved ] && [ "$ASSOCIATION" = OWNER ] && [ "$REVIEW_SHA" = "$HEAD_SHA" ]; then
            echo "cross-review: ok, a code owner approved $HEAD_SHA"
            exit 0
          fi
          # Otherwise the result of the review for this commit stays.
          conclusion=$(gh api "repos/$REPO/actions/workflows/cross-review.yml/runs?head_sha=$HEAD_SHA&event=pull_request_target" --jq '.workflow_runs[0].conclusion // "missing"')
          echo "cross-review: the review of $HEAD_SHA ended with $conclusion"
          [ "$conclusion" = success ]
